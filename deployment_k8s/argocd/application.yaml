apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudops-app

spec:
  project: default

  source:
    repoURL: https://github.com/Mficius/multi-conteneur-laravel-nginx.git
    targetRevision: HEAD
    path: deployment_k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true